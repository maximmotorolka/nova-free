<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova - AI Chatbot</title>
<meta name="description" content="Nova - AI Chatbot. One AI. Many minds. Free, no account needed.">
<link rel="icon" href="assets/favicon-novaapp.ico">
<link rel="apple-touch-icon" href="assets/apple-touch-icon-novaapp.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;
  --bg-soft:#101012;
  --panel:#141417;
  --panel-2:#1a1a1f;
  --border:rgba(255,255,255,.08);
  --border-soft:rgba(255,255,255,.05);
  --text:#fafafa;
  --muted:#a1a1aa;
  --dim:#71717a;
  --accent:#7c3aed;
  --accent-2:#a855f7;
  --accent-soft:rgba(124,58,237,.16);
  --user-bubble:#1f1f26;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.sidebar{
  width:288px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg-soft);border-right:1px solid var(--border-soft);
}
.side-head{display:flex;align-items:center;gap:10px;padding:16px 14px 10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo svg{width:26px;height:26px;flex-shrink:0}
.side-new{
  margin:6px 14px 10px;padding:10px 12px;border-radius:12px;
  background:var(--panel);border:1px solid var(--border);
  display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;
  transition:background .15s,border-color .15s;
}
.side-new:hover{background:var(--panel-2);border-color:rgba(255,255,255,.16)}
.side-new svg{width:16px;height:16px;color:var(--muted)}
.side-label{padding:8px 18px 6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.side-chats{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:9px 10px;border-radius:10px;font-size:14px;color:var(--muted);
  white-space:nowrap;overflow:hidden;transition:background .12s,color .12s;
}
.chat-item span{overflow:hidden;text-overflow:ellipsis;flex:1}
.chat-item:hover{background:var(--panel);color:var(--text)}
.chat-item.active{background:var(--panel-2);color:var(--text)}
.chat-item .del{opacity:0;width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--dim)}
.chat-item:hover .del{opacity:1}
.chat-item .del:hover{background:rgba(255,255,255,.1);color:var(--text)}
.side-foot{padding:12px 14px;border-top:1px solid var(--border-soft)}
.free-card{
  display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;
  background:linear-gradient(135deg,rgba(124,58,237,.14),rgba(168,85,247,.05));
  border:1px solid rgba(124,58,237,.25);
}
.free-card .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;flex-shrink:0;box-shadow:0 0 8px rgba(34,197,94,.8)}
.free-card b{font-size:13.5px;display:block}
.free-card small{font-size:12px;color:var(--muted)}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;align-items:center;justify-content:center;color:var(--muted)}
.menu-btn:hover{background:var(--panel)}
.menu-btn svg{width:20px;height:20px}

/* ---------- Main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;
  background:radial-gradient(1200px 500px at 50% -10%,rgba(124,58,237,.08),transparent 60%),var(--bg);}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--border-soft)}
.topbar .spacer{flex:1}
.model-btn{
  display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;
  font-size:14px;font-weight:600;transition:background .12s;
}
.model-btn:hover{background:var(--panel)}
.model-btn .mv{color:var(--text)}
.model-btn svg{width:14px;height:14px;color:var(--dim);transition:transform .15s}
.model-btn.open svg{transform:rotate(180deg)}
.model-pop{
  position:absolute;top:56px;left:74px;z-index:50;min-width:290px;
  background:var(--panel);border:1px solid var(--border);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);padding:6px;display:none;
}
.model-pop.open{display:block}
.model-pop .mp-label{padding:8px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.model-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;font-size:14px}
.model-opt small{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:1px}
.model-opt:hover{background:var(--panel-2)}
.model-opt.active{background:var(--accent-soft)}
.model-opt .chk{color:var(--accent-2);font-weight:700}
.badge{font-size:10.5px;font-weight:700;padding:2.5px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-2);border:1px solid rgba(124,58,237,.35);letter-spacing:.02em;white-space:nowrap}

.content{flex:1;overflow-y:auto;display:flex;flex-direction:column}

/* ---------- Hero ---------- */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px 30px;gap:18px}
.hero .hero-logo{width:54px;height:54px;opacity:.95;animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.hero h1{font-size:clamp(26px,4vw,38px);font-weight:700;letter-spacing:-.02em;text-align:center;
  background:linear-gradient(90deg,#fff 30%,#c4b5fd 70%,#e9d5ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);font-size:15.5px;text-align:center;max-width:520px}
.hero-input{
  width:100%;max-width:680px;margin-top:6px;border-radius:22px;padding:8px 8px 8px 20px;
  background:var(--panel);border:1px solid var(--border);
  display:flex;align-items:flex-end;gap:8px;transition:border-color .15s,box-shadow .15s;
}
.hero-input:focus-within{border-color:rgba(124,58,237,.55);box-shadow:0 0 0 4px rgba(124,58,237,.12)}
.hero-input textarea{
  flex:1;background:none;border:none;outline:none;resize:none;
  font-size:15.5px;line-height:1.5;padding:10px 0;max-height:180px;color:var(--text);
}
.hero-input textarea::placeholder{color:var(--dim)}
.send-btn{
  width:40px;height:40px;border-radius:14px;flex-shrink:0;margin:4px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;transition:opacity .15s,transform .1s;
}
.send-btn:hover{opacity:.9}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.35;cursor:default}
.send-btn svg{width:18px;height:18px;color:#fff}
.stop-btn{width:40px;height:40px;border-radius:14px;flex-shrink:0;margin:4px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center}
.stop-btn svg{width:14px;height:14px;color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:680px}
.chip{
  padding:8px 14px;border-radius:99px;font-size:13px;color:var(--muted);
  background:var(--panel);border:1px solid var(--border);transition:all .15s;
}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.2);background:var(--panel-2)}

/* ---------- Messages ---------- */
.msgs{width:100%;max-width:780px;margin:0 auto;padding:26px 20px 10px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;flex-direction:column;gap:6px;animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-items:flex-end}
.msg.user .bubble{
  background:var(--user-bubble);border:1px solid var(--border-soft);
  padding:11px 16px;border-radius:18px;max-width:82%;white-space:pre-wrap;word-break:break-word;
}
.msg.assistant .bubble{max-width:100%;word-break:break-word;padding:2px 0}
.msg .meta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;padding:0 2px}
.msg .meta .acts{display:none;gap:4px}
.msg:hover .meta .acts{display:flex}
.acts button{display:flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:12px;color:var(--dim)}
.acts button:hover{background:var(--panel);color:var(--text)}
.acts svg{width:13px;height:13px}
.typing{display:flex;gap:5px;padding:10px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.think{color:var(--dim);font-style:italic;font-size:14px;padding:10px 2px;display:flex;align-items:center;gap:8px}
.think i{width:6px;height:6px;border-radius:50%;background:var(--accent-2);animation:blink 1.2s infinite}
.cursor{display:inline-block;width:8px;height:16px;background:var(--accent-2);vertical-align:-2px;margin-left:2px;animation:blink 1s infinite;border-radius:2px}

/* markdown */
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md pre{background:#0d0d10;border:1px solid var(--border-soft);border-radius:12px;padding:13px 15px;overflow-x:auto;margin:10px 0;font-size:13.5px}
.md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em}
.md :not(pre)>code{background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}
.md ul,.md ol{margin:8px 0 10px 22px;display:flex;flex-direction:column;gap:4px}
.md a{color:var(--accent-2);text-decoration:none;border-bottom:1px solid rgba(168,85,247,.4)}
.md a:hover{border-bottom-color:var(--accent-2)}
.md h1,.md h2,.md h3{margin:14px 0 8px;font-weight:600;letter-spacing:-.01em}
.md h1{font-size:1.35em}.md h2{font-size:1.2em}.md h3{font-size:1.08em}
.md blockquote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;color:var(--muted);margin:8px 0}
.md hr{border:none;border-top:1px solid var(--border);margin:14px 0}
.md table{border-collapse:collapse;margin:10px 0;width:100%;font-size:14px}
.md th,.md td{border:1px solid var(--border);padding:7px 10px;text-align:left}
.md th{background:var(--panel)}
.md strong{font-weight:600}

/* ---------- Composer (chat mode) ---------- */
.composer{padding:10px 20px 18px}
.composer .hero-input{max-width:780px;margin:0 auto}
.composer .note{max-width:780px;margin:8px auto 0;text-align:center;font-size:11.5px;color:var(--dim)}

/* ---------- Mobile ---------- */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
.overlay.open{display:block}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 60px rgba(0,0,0,.6)}
  .sidebar.open{transform:none}
  .menu-btn{display:flex}
  .model-pop{left:64px}
}
</style>
</head>
<body>
<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="side-head">
      <div class="logo">
        <svg viewBox="0 0 32 32" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M16 2.5c.9 7.9 5.6 12.6 13.5 13.5-7.9.9-12.6 5.6-13.5 13.5C15.1 21.6 10.4 16.9 2.5 16 10.4 15.1 15.1 10.4 16 2.5z" fill="url(#lg)"/></svg>
        Nova
      </div>
    </div>
    <button class="side-new" id="newChatBtn" title="New chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New chat
    </button>
    <div class="side-label">Chats</div>
    <div class="side-chats" id="chatList"></div>
    <div class="side-foot">
      <div class="free-card">
        <div class="dot"></div>
        <div><b>Nova Free</b><small>No account. No Pro. Just chat.</small></div>
      </div>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <button class="model-btn" id="modelBtn">
        <svg viewBox="0 0 32 32" fill="none" width="18" height="18"><defs><linearGradient id="lg2" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M16 2.5c.9 7.9 5.6 12.6 13.5 13.5-7.9.9-12.6 5.6-13.5 13.5C15.1 21.6 10.4 16.9 2.5 16 10.4 15.1 15.1 10.4 16 2.5z" fill="url(#lg2)"/></svg>
        <span class="mv" id="modelLabel">Auto</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="spacer"></span>
      <span style="font-size:12px;color:var(--dim)">Free · GPT‑OSS 20B</span>
    </div>

    <div class="model-pop" id="modelPop">
      <div class="mp-label">Model</div>
      <div id="modelOpts"></div>
    </div>

    <div class="content" id="content">
      <div class="hero" id="hero">
        <svg class="hero-logo" viewBox="0 0 32 32" fill="none"><defs><linearGradient id="lg3" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#c084fc"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><path d="M16 2.5c.9 7.9 5.6 12.6 13.5 13.5-7.9.9-12.6 5.6-13.5 13.5C15.1 21.6 10.4 16.9 2.5 16 10.4 15.1 15.1 10.4 16 2.5z" fill="url(#lg3)"/></svg>
        <h1>One AI. Many minds</h1>
        <p>Ask anything, with any model</p>
        <div class="hero-input">
          <textarea id="heroInput" rows="1" placeholder="Ask anything..."></textarea>
          <button class="send-btn" id="heroSend" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="msgs" id="msgs" style="display:none"></div>
    </div>

    <div class="composer" id="composer" style="display:none">
      <div class="hero-input">
        <textarea id="chatInput" rows="1" placeholder="Type a message"></textarea>
        <button class="send-btn" id="chatSend" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
        <button class="stop-btn" id="stopBtn" style="display:none" aria-label="Stop">
          <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="note">Nova is a free clone of the Nova chat experience · powered by the open GPT‑OSS 20B model via pollinations.ai · responses can be wrong</div>
    </div>
  </main>
</div>

<script>
"use strict";
/* ================= Config ================= */
const API = "https://text.pollinations.ai/openai";
const ENGINE = "openai-fast"; // GPT-OSS 20B (free, open)
const BASE_SYS = "You are Nova, a friendly and helpful AI chatbot. Answer directly in the user's language. Use Markdown when it helps.";
const MODELS = [
  { id:"auto",   name:"Auto",                  sub:"Smart answer, any topic",            badge:"Recommended", sys:BASE_SYS },
  { id:"fast",   name:"Nova · GPT‑OSS 20B",    sub:"Fast open model, no limits",         badge:"Free",        sys:BASE_SYS },
  { id:"coder",  name:"Nova Coder",            sub:"Code, bugs, tech questions",         badge:"Free",        sys:BASE_SYS + " You are an expert programmer: give precise, working code and explain briefly." },
  { id:"writer", name:"Nova Writer",           sub:"Texts, ideas, creativity",           badge:"Free",        sys:BASE_SYS + " You are a skilled writer: clear structure, engaging style, no fluff." },
  { id:"ru",     name:"Nova RU",               sub:"Отвечает по‑русски",                 badge:"Free",        sys:BASE_SYS + " Always answer in Russian, unless the user writes in another language." }
];
const CHIPS = ["Programming","Writing","Creative","Research","Travel"];
const LS_KEY = "nova.free.chats.v1";
const LS_MODEL = "nova.free.model";

/* ================= State ================= */
let chats = load();
let currentId = null;
let model = localStorage.getItem(LS_MODEL) || "auto";
let streaming = false;
let aborter = null;
if (!MODELS.some(m=>m.id===model)) model = "auto";

function load(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_KEY) || "[]");
    return Array.isArray(d) ? d.filter(c=>c && Array.isArray(c.msgs)) : [];
  }catch(e){ return []; }
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(chats.slice(0,80))); }catch(e){}
}
function cur(){ return chats.find(c=>c.id===currentId) || null; }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ================= Markdown ================= */
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function inline(s){
  s = s.replace(/`([^`\n]+)`/g, (m,c)=>"<code>"+c+"</code>");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|\W)\*([^*\n]+)\*(?=\W|$)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(src){
  const lines = String(src).replace(/\r\n/g,"\n").split("\n");
  let out = "", i = 0, inList = null; // 'ul' | 'ol'
  const closeList = ()=>{ if(inList){ out += "</"+inList+">"; inList=null; } };
  while(i < lines.length){
    let ln = lines[i];
    if(/^```/.test(ln)){
      closeList();
      const lang = ln.slice(3).trim();
      let code = [];
      i++;
      while(i < lines.length && !/^```\s*$/.test(lines[i])){ code.push(lines[i]); i++; }
      i++;
      out += "<pre><code>" + esc(code.join("\n")) + "</code></pre>";
      continue;
    }
    if(/^\s*([-*])\s+/.test(ln)){
      if(inList !== "ul"){ closeList(); out += "<ul>"; inList="ul"; }
      out += "<li>" + inline(esc(ln.replace(/^\s*[-*]\s+/,""))) + "</li>";
      i++; continue;
    }
    if(/^\s*\d+[.)]\s+/.test(ln)){
      if(inList !== "ol"){ closeList(); out += "<ol>"; inList="ol"; }
      out += "<li>" + inline(esc(ln.replace(/^\s*\d+[.)]\s+/,""))) + "</li>";
      i++; continue;
    }
    if(/^###\s+/.test(ln)){ closeList(); out += "<h3>"+inline(esc(ln.replace(/^###\s+/,"")))+"</h3>"; i++; continue; }
    if(/^##\s+/.test(ln)){ closeList(); out += "<h2>"+inline(esc(ln.replace(/^##\s+/,"")))+"</h2>"; i++; continue; }
    if(/^#\s+/.test(ln)){ closeList(); out += "<h1>"+inline(esc(ln.replace(/^#\s+/,"")))+"</h1>"; i++; continue; }
    if(/^\s*---+\s*$/.test(ln)){ closeList(); out += "<hr>"; i++; continue; }
    if(/^&gt;\s?|^>\s?/.test(ln)){
      closeList();
      let q = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out += "<blockquote><p>"+inline(esc(q.join(" ")))+"</p></blockquote>";
      continue;
    }
    if(/^\|(.+)\|\s*$/.test(ln)){
      closeList();
      const row = s=>s.replace(/^\||\|\s*$/g,"").split("|").map(x=>x.trim());
      let cells = row(ln);
      i++;
      if(i < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i])) i++;
      let rows = [];
      while(i < lines.length && /^\|(.+)\|\s*$/.test(lines[i])){ rows.push(row(lines[i])); i++; }
      out += "<table><tr>" + cells.map(c=>"<th>"+inline(esc(c))+"</th>").join("") + "</tr>" +
             rows.map(r=>"<tr>"+r.map(c=>"<td>"+inline(esc(c))+"</td>").join("")+"</tr>").join("") + "</table>";
      continue;
    }
    if(ln.trim()===""){ closeList(); i++; continue; }
    closeList();
    let para = [ln];
    i++;
    while(i < lines.length && lines[i].trim()!=="" && !/^(```|#{1,3}\s|[-*]\s|\d+[.)]\s|\||\s*>)/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    out += "<p>" + inline(esc(para.join(" "))) + "</p>";
  }
  closeList();
  return out;
}

/* ================= API ================= */
async function ask(messages, onDelta, onReasoning, signal){
  const res = await fetch(API, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ model: ENGINE, messages, stream:true }),
    signal
  });
  if(!res.ok){
    let msg = "HTTP " + res.status;
    try{ const j = await res.json(); msg = j.error || j.message || msg; }catch(e){}
    throw new Error(msg);
  }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", got = false;
  while(true){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf("\n")) >= 0){
      const line = buf.slice(0, idx).trim();
      buf = buf.slice(idx+1);
      if(!line.startsWith("data:")) continue;
      const data = line.slice(5).trim();
      if(data === "[DONE]") continue;
      let j; try{ j = JSON.parse(data); }catch(e){ continue; }
      const d = j.choices && j.choices[0] && j.choices[0].delta;
      if(d && typeof d.content === "string" && d.content){ got = true; onDelta(d.content); }
      else if(d && typeof d.reasoning === "string" && d.reasoning && onReasoning) onReasoning(d.reasoning);
    }
  }
  if(!got) throw new Error("Empty response from model");
}

/* ================= UI refs ================= */
const $ = id => document.getElementById(id);
const hero=$("hero"), msgs=$("msgs"), composer=$("composer");
const heroInput=$("heroInput"), chatInput=$("chatInput");
const heroSend=$("heroSend"), chatSend=$("chatSend"), stopBtn=$("stopBtn");
const modelBtn=$("modelBtn"), modelPop=$("modelPop"), modelOpts=$("modelOpts"), modelLabel=$("modelLabel");
const chatList=$("chatList"), content=$("content");
const sidebar=$("sidebar"), overlay=$("overlay");

function autoGrow(t){ t.style.height="auto"; t.style.height=Math.min(t.scrollHeight,180)+"px"; }
[heroInput,chatInput].forEach(t=>t.addEventListener("input",()=>autoGrow(t)));

function currentInput(){ return cur() ? chatInput : heroInput; }

function sendFrom(t){
  const text = t.value.trim();
  if(!text || streaming) return;
  t.value=""; autoGrow(t);
  if(!cur()) newChat(text);
  doSend(text);
}
function doSend(text){
  const c = cur();
  c.msgs.push({role:"user", content:text});
  if(c.msgs.filter(m=>m.role==="user").length === 1) c.title = text.slice(0,48) + (text.length>48?"…":"");
  save();
  renderSidebar();
  renderMode();
  const m = MODELS.find(x=>x.id===model) || MODELS[0];
  const apiMsgs = [{role:"system", content:m.sys}].concat(
    c.msgs.slice(-16).map(x=>({role:x.role, content:x.content}))
  );
  startAssistant(apiMsgs, m);
}

async function startAssistant(apiMsgs, m){
  streaming = true;
  aborter = new AbortController();
  heroSend.style.display="none"; chatSend.style.display="none"; stopBtn.style.display="flex";
  const bubble = addAssistantBubble("…");
  const body = bubble.querySelector(".body");
  let acc = "";
  let contentStarted = false, thinkingShown = false;
  const showThinking = ()=>{
    if(!contentStarted && !thinkingShown){
      thinkingShown = true;
      body.innerHTML = '<div class="think"><i></i>Thinking…</div>';
    }
  };
  const t0 = Date.now();
  try{
    await ask(apiMsgs, d=>{
      if(!contentStarted){ contentStarted = true; body.innerHTML = ""; }
      acc += d;
      body.innerHTML = md(acc) + '<span class="cursor"></span>';
      content.scrollTop = content.scrollHeight;
    }, showThinking, aborter.signal);
    cur().msgs.push({role:"assistant", content:acc});
    save();
    body.innerHTML = md(acc);
    setMeta(bubble, m, Date.now()-t0);
  }catch(e){
    if(e.name === "AbortError"){
      if(acc){ cur().msgs.push({role:"assistant", content:acc}); save(); body.innerHTML = md(acc); setMeta(bubble, m, Date.now()-t0); }
      else removeBubble(bubble);
    }else{
      body.innerHTML = '<p style="color:#fb7185">⚠ ' + esc(e.message) + ' — try again in a few seconds.</p>';
      removeBubble(bubble);
    }
  }finally{
    streaming = false;
    aborter = null;
    heroSend.style.display="flex"; chatSend.style.display="flex"; stopBtn.style.display="none";
    content.scrollTop = content.scrollHeight;
  }
}

function setMeta(bubble, m, ms){
  const meta = bubble.querySelector(".meta");
  meta.innerHTML =
    '<span>' + esc(m.name) + ' · ' + (ms/1000).toFixed(1) + 's</span>' +
    '<span class="acts">' +
      '<button data-act="copy" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copy</button>' +
      '<button data-act="regen" title="Regenerate"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>Regenerate</button>' +
    '</span>';
  meta.querySelector('[data-act="copy"]').onclick = ()=>{
    const c = cur(); if(!c) return;
    const a = c.msgs.filter(x=>x.role==="assistant").pop();
    if(a) navigator.clipboard && navigator.clipboard.writeText(a.content);
  };
  meta.querySelector('[data-act="regen"]').onclick = ()=>{
    if(streaming) return;
    const c = cur(); if(!c) return;
    const last = c.msgs[c.msgs.length-1];
    if(last && last.role==="assistant") c.msgs.pop();
    save();
    const am = MODELS.find(x=>x.id===model) || MODELS[0];
    const apiMsgs = [{role:"system", content:am.sys}].concat(c.msgs.slice(-16).map(x=>({role:x.role,content:x.content})));
    startAssistant(apiMsgs, am);
  };
}

function addAssistantBubble(placeholder){
  const div = document.createElement("div");
  div.className = "msg assistant";
  div.innerHTML = '<div class="bubble"><div class="body">' + (placeholder==="…" ? '<div class="typing"><i></i><i></i><i></i></div>' : "") + '</div></div><div class="meta"></div>';
  msgs.appendChild(div);
  content.scrollTop = content.scrollHeight;
  return div;
}
function removeBubble(b){ b.remove(); }

/* ================= Rendering ================= */
function renderMode(){
  const c = cur();
  hero.style.display = c ? "none" : "flex";
  msgs.style.display = c ? "flex" : "none";
  composer.style.display = c ? "block" : "none";
  if(c) renderChat();
  renderSidebar();
}
function renderChat(){
  const c = cur(); if(!c) return;
  msgs.innerHTML = "";
  c.msgs.forEach(m=>{
    if(m.role === "user"){
      const d = document.createElement("div");
      d.className = "msg user";
      d.innerHTML = '<div class="bubble"></div>';
      d.querySelector(".bubble").textContent = m.content;
      msgs.appendChild(d);
    }else{
      const m2 = MODELS.find(x=>x.id===(c.model)) || MODELS[0];
      const d = document.createElement("div");
      d.className = "msg assistant";
      d.innerHTML = '<div class="bubble"><div class="body"></div></div><div class="meta"><span>' + esc(m2.name) + '</span></div>';
      d.querySelector(".body").innerHTML = md(m.content);
      msgs.appendChild(d);
    }
  });
  content.scrollTop = content.scrollHeight;
}
function renderSidebar(){
  chatList.innerHTML = "";
  chats.slice().reverse().forEach(c=>{
    const b = document.createElement("button");
    b.className = "chat-item" + (c.id===currentId ? " active" : "");
    b.innerHTML = '<span></span><span class="del" title="Delete"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></span>';
    b.querySelector("span").textContent = c.title || "New chat";
    b.onclick = ()=>{ if(streaming) return; currentId = c.id; renderMode(); closeSide(); };
    b.querySelector(".del").onclick = (e)=>{
      e.stopPropagation();
      chats = chats.filter(x=>x.id!==c.id);
      if(currentId===c.id) currentId = null;
      save(); renderMode();
    };
    chatList.appendChild(b);
  });
}
function renderModels(){
  modelLabel.textContent = (MODELS.find(m=>m.id===model)||MODELS[0]).name;
  modelOpts.innerHTML = "";
  MODELS.forEach(m=>{
    const b = document.createElement("button");
    b.className = "model-opt" + (m.id===model?" active":"");
    b.innerHTML = '<span><span style="font-weight:600">'+esc(m.name)+'</span><small>'+esc(m.sub)+'</small></span>' +
      (m.id===model ? '<span class="chk">✓</span>' : '<span class="badge">'+esc(m.badge)+'</span>');
    b.onclick = ()=>{ model = m.id; localStorage.setItem(LS_MODEL, model); renderModels(); closeModelPop(); };
    modelOpts.appendChild(b);
  });
}
function newChat(preset){
  currentId = uid();
  chats.unshift({ id:currentId, title:"", model:model, msgs:[] });
  save();
  renderMode();
  if(preset) currentInput().focus();
  else (cur() ? chatInput : heroInput).focus();
}

/* ================= Events ================= */
heroSend.onclick = ()=>sendFrom(heroInput);
chatSend.onclick = ()=>sendFrom(chatInput);
stopBtn.onclick = ()=>{ if(aborter) aborter.abort(); };
[heroInput,chatInput].forEach(t=>t.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendFrom(t); }
}));
$("newChatBtn").onclick = ()=>{ newChat(true); closeSide(); };
$("chips").innerHTML = CHIPS.map(c=>'<button class="chip" data-c="'+c+'">'+c+'</button>').join("");
$("chips").onclick = e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  heroInput.value = b.textContent + ": ";
  heroInput.focus(); autoGrow(heroInput);
};
modelBtn.onclick = (e)=>{ e.stopPropagation(); modelPop.classList.toggle("open"); modelBtn.classList.toggle("open"); };
function closeModelPop(){ modelPop.classList.remove("open"); modelBtn.classList.remove("open"); }
document.addEventListener("click", e=>{
  if(!modelPop.contains(e.target)) closeModelPop();
});
$("menuBtn").onclick = ()=>{ sidebar.classList.add("open"); overlay.classList.add("open"); };
function closeSide(){ sidebar.classList.remove("open"); overlay.classList.remove("open"); }
overlay.onclick = closeSide;
document.addEventListener("keydown", e=>{ if(e.key==="Escape"){ closeModelPop(); closeSide(); } });

/* ================= Init ================= */
renderModels();
if(chats.length) currentId = chats[0].id;
renderMode();
heroInput.focus();
</script>
</body>
